<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什麼？附近美食大輪盤</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🍴 今天吃什麼？</h1>
        
        <div class="controls">
            <select id="mealType">
                <option value="breakfast">早餐</option>
                <option value="lunch">中午正餐</option>
                <option value="afternoon_tea">下午茶飲</option>
                <option value="dinner">晚餐</option>
                <option value="late_night">宵夜</option>
            </select>
            <button onclick="fetchNearbyPlaces()">重新整理附近店家</button>
        </div>

        <div class="wheel-container">
            <canvas id="wheel" width="400" height="400"></canvas>
            <div id="pointer">▼</div>
            <button id="spinBtn">開始抽籤</button>
        </div>

        <div id="result">
            <h2 id="storeName">點擊輪盤開始抉擇</h2>
            <p id="storeAddress"></p>
            <a id="menuLink" href="#" target="_blank" style="display:none;">查看地圖與菜單</a>
        </div>
    </div>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAqkQwPWMvU0hK7hQuVXVlDzcvr_LA9HWA&libraries=places"></script>
    <script src="script.js"></script>
</body>
</html>
